[package]
name = "teri"
version = "0.1.0"
edition = "2024"
authors = ["Kresna Sucandra"]
description = "Teri — A Rust-native Swarm Intelligence Prediction Engine"
license = "MIT"
repository = "https://github.com/SHA888/teri"
keywords = ["swarm", "multi-agent", "simulation", "llm", "prediction"]
categories = ["simulation", "science"]

[[bin]]
name = "teri"
path = "src/main.rs"

[lib]
name = "teri"
path = "src/lib.rs"

[dependencies]
redb = "2"
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (API layer)
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bincode = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Graph data structures (knowledge graph)
petgraph = "0.6"

# Parallel computation (agent simulation)
rayon = "1"

# Fast non-poisoning mutex for short critical sections in async code
parking_lot = "0.12"

# Async stream utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"

# Async trait support
async-trait = "0.1"

# Persistent key-value store (agent memory)


# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Size-based rotating file appender (10 MB x 5 backups — matches MiroFish RotatingFileHandler)
file-rotate = "0.8"

# Config & env
dotenvy = "0.15"
config = "0.14"

# Error handling
anyhow = "1"
thiserror = "1"

# UUID for agent/world IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Templating (persona/prompt templates)
minijinja = "1"

# Regex (used by OntologyGenerator._to_pascal_case — S-173)
regex = "1"

# CSV writing (OASIS twitter_profiles.csv export — S-370)
csv = "1"

# SQLite for interview history storage (optional, feature-gated for security)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# File format support
pdfium-render = "0.8"
scraper = "0.19"
encoding_rs = "0.8"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
tempfile = "3"
httpmock = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = []
sqlite = ["rusqlite"]

[workspace]
