[package]
name = "teri"
version = "0.1.0"
edition = "2024"
authors = ["Kresna Sucandra"]
description = "Teri — A Rust-native Swarm Intelligence Prediction Engine"
license = "MIT"
repository = "https://github.com/SHA888/teri"
keywords = ["swarm", "multi-agent", "simulation", "llm", "prediction"]
categories = ["simulation", "science"]

[[bin]]
name = "teri"
path = "src/main.rs"

[lib]
name = "teri"
path = "src/lib.rs"

[dependencies]
redb = "2"
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (API layer)
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bincode = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Graph data structures (knowledge graph)
petgraph = "0.6"

# Parallel computation (agent simulation)
rayon = "1"

# Seedable RNG for the time-based agent activation policy (U-028). Python's OASIS scripts use the
# unseeded `random` module; teri uses a seedable `StdRng` (entropy in production, fixed-seed in
# tests) so the stochastic-but-structured activation is reproducible for the parity gate.
rand = "0.8"

# Fast non-poisoning mutex for short critical sections in async code
parking_lot = "0.12"

# Async stream utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"

# Async trait support
async-trait = "0.1"

# Persistent key-value store (agent memory)


# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Size-based rotating file appender (10 MB x 5 backups — matches MiroFish RotatingFileHandler)
file-rotate = "0.8"

# Config & env
dotenvy = "0.15"
config = "0.14"

# Error handling
anyhow = "1"
thiserror = "1"

# UUID for agent/world IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Templating (persona/prompt templates)
minijinja = "1"

# Regex (used by OntologyGenerator._to_pascal_case — S-173)
regex = "1"

# CSV writing (OASIS twitter_profiles.csv export — S-370)
csv = "1"

# SQLite for interview history storage (optional, feature-gated for security)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# File format support
pdfium-render = "0.8"
scraper = "0.19"
encoding_rs = "0.8"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
tempfile = "3"
httpmock = "0.7"
# Dev-only: drive the REAL pebesen intelligence receiver in-process for the
# teri<->pebesen end-to-end loop test (tests/community_loop_e2e.rs). This is a
# TEST dependency only — the runtime seam stays HTTP-decoupled (no prod dep).
pebesen-intelligence = { path = "pebesen/crates/intelligence" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
# `sqlite` is ON by default (S8 / TASK-SIM-3): a normal `cargo build` / `teri serve` then BOTH
# produces the social world to `{sim_dir}/{platform}_simulation.db` (via the `SocialDbWriter`
# producer installed on the live run/serve path) AND reads it back through the `/posts` +
# `/comments` readers — the full producer→path→schema→reader loop, verified end-to-end. rusqlite is
# `bundled`, so CI's C toolchain compiles it with no system-sqlite dependency. Build WITHOUT the DB
# (the honest-500 + no-DB-empty contracts still hold) via `--no-default-features`.
default = ["sqlite"]
sqlite = ["rusqlite"]

[workspace]
# teri is the root package; the pebesen community-platform crates are vendored members.
# `default-members` keeps bare `cargo build`/`test`/`clippy` scoped to teri so the engine's
# normal workflow and CI stay unaffected — the pebesen crates (which need postgres/redis) build
# explicitly via `-p pebesen-*` or `--workspace`.
resolver = "2"
members = ["pebesen/crates/*"]
default-members = ["."]

# Shared metadata inherited by pebesen crates that use `edition.workspace`/`rust-version.workspace`
# (e.g. pebesen-intelligence). Mirrors the values from pebesen's former workspace root.
[workspace.package]
edition = "2024"
rust-version = "1.85"
