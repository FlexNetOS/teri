name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly re-audit so a newly-disclosed advisory is caught even without a push.
    - cron: "0 6 * * 1"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny.toml is checked in at the repo root; this enforces advisories, bans, licenses, sources.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
