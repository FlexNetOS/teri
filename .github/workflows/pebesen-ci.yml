name: Pebesen CI

# Pebesen (community platform) was vendored into teri (crates under pebesen/crates/, frontend
# under pebesen/frontend/). Its crates are workspace members but excluded from teri's default
# build, so they get their own pipeline here, scoped to changes under pebesen/.

on:
  push:
    branches: [main]
    paths: ['pebesen/**', '.sqlx/**', '.github/workflows/pebesen-ci.yml']
  pull_request:
    branches: [main]
    paths: ['pebesen/**', '.sqlx/**', '.github/workflows/pebesen-ci.yml']

env:
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-pebesen-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pebesen-cargo-

      # rustup may auto-sync a newer nightly mid-run without the rustfmt/clippy
      # components; ensure they exist for the active toolchain before using them.
      - name: Ensure rustfmt + clippy components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt -p pebesen-core -p pebesen-db -p pebesen-api -p pebesen-search -p pebesen-notifications -p pebesen-intelligence -p pebesen-bin --check

      - name: Clippy
        run: cargo clippy -p pebesen-core -p pebesen-db -p pebesen-api -p pebesen-search -p pebesen-notifications -p pebesen-intelligence -p pebesen-bin --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p pebesen-core -p pebesen-db -p pebesen-api -p pebesen-search -p pebesen-notifications -p pebesen-intelligence -p pebesen-bin --all-features

      # Advisory scanning is handled workspace-wide by teri's cargo-deny workflow;
      # no separate cargo-audit step here (avoids a slow duplicate install).

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Non-blocking: the vendored pebesen frontend isn't wired into teri's release
    # path yet (its lockfile/build are pebesen-internal). Informational until the
    # pebesen UI is integrated; tracked in FEATURE-PARITY.md (TASK-SEAM follow-ups).
    continue-on-error: true
    defaults:
      run:
        working-directory: pebesen/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pebesen/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint || true  # Allow lint to fail for now

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test || true  # Allow tests to fail for now

      - name: Audit
        run: pnpm audit --audit-level moderate

  docker:
    name: Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pebesen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config

      - name: Start services
        run: |
          docker compose up -d postgres redis meilisearch
          sleep 15

      - name: Check service health
        run: |
          docker compose ps
          docker compose logs postgres || true

      - name: Cleanup
        run: docker compose down -v
