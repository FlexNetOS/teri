name: Promote develop → main

# Auto-resync: keeps main in sync with develop with ZERO manual steps.
# Fires on every push to develop (i.e. every merge into the gated integration branch); this
# workflow re-verifies the develop tip and fast-forwards main to it. Also runnable by hand
# (workflow_dispatch) and on a weekly safety-net schedule.
#
# Branch model (confirmed by branch protection): develop is the GATED integration branch
# (required status checks); main is the released line (unprotected promotion target). Work lands
# on develop via PR → CI gates it → this workflow promotes it to main. develop is always a strict
# ancestor-or-ahead of main, so promotion is a fast-forward — never a divergent merge. The
# `--ff-only` guard below is the safety valve: if develop ever diverges, promotion refuses rather
# than papering over it. No PAT needed (main is unprotected; GITHUB_TOKEN + contents:write pushes).

on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    # Weekly safety-net (Mondays 07:00 UTC) — only acts if develop is ahead AND verifies clean.
    - cron: "0 7 * * 1"

concurrency:
  group: promote-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Re-verify the develop tip independently before it becomes main — belt-and-suspenders
  # on top of the CI that already gated every PR into develop.
  verify:
    name: Verify develop tip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --verbose

  promote:
    name: Fast-forward main → develop
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to the verified develop tip
        run: |
          git fetch origin main develop
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/develop)" ]; then
            echo "main is already at develop ($(git rev-parse --short origin/develop)) — nothing to promote."
            exit 0
          fi
          git checkout main
          # --ff-only refuses to promote if develop has diverged from main (it never should);
          # that refusal is the safety valve, not an error to paper over.
          git merge --ff-only origin/develop
          git push origin main
          echo "Promoted main → $(git rev-parse --short HEAD)"
