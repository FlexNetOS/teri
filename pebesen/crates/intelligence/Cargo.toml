[package]
name = "pebesen-intelligence"
license = "MIT"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Prediction-receiver types + in-memory store. Mirrors teri's pushed payloads
# WITHOUT depending on teri (the seam is HTTP/JSON; this crate owns its own types).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
# HTTP receiver router (the pebesen-side half of the live teri<->pebesen loop).
axum = "0.7"
# Async store trait (covers both in-memory and the Postgres backend).
async-trait = "0.1"
# Postgres-backed store (feature `postgres`). Runtime queries — no compile-time
# DB / offline cache needed. Version + features track pebesen-db for consistency.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
], optional = true }

[features]
# Enable the sqlx/Postgres-backed PgStore. Off by default — the in-memory store
# is the default backend and needs no database.
postgres = ["dep:sqlx"]

[dev-dependencies]
# The shared async behavior test (and the gated live-Postgres test) need a runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
